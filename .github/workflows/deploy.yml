name: Deploy Typrr

on:
  push:
    branches: ["main"]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-central-1

  # 🔥 ROZDZIELONE
  ECR_REGISTRY: 613136968754.dkr.ecr.eu-central-1.amazonaws.com
  ECR_REPOSITORY: typrr-backend

  ECS_CLUSTER: typrr-cluster
  ECS_SERVICE: typrr-backend-service
  S3_BUCKET: typrr-frontend-prod-613136968754
  CLOUDFRONT_ID: E4D0MBKIV3QMA

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # =========================
      # Checkout
      # =========================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================
      # AWS auth
      # =========================
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::613136968754:role/github-actions-typrr
          aws-region: ${{ env.AWS_REGION }}

      # =========================
      # ECR LOGIN (FIX)
      # =========================
      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region $AWS_REGION | \
          docker login --username AWS --password-stdin $ECR_REGISTRY

      # =========================
      # BUILD
      # =========================
      - name: Build Docker image
        run: docker build -t typrr-backend ./typrr-backend

      # =========================
      # TAG
      # =========================
      - name: Tag image
        run: docker tag typrr-backend:latest $ECR_REGISTRY/$ECR_REPOSITORY:latest

      # =========================
      # PUSH
      # =========================
      - name: Push image
        run: docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      # =========================
      # MIGRATIONS
      # =========================
      - name: Run Prisma migrations
        run: |
          aws ecs run-task \
            --cluster "$ECS_CLUSTER" \
            --launch-type FARGATE \
            --task-definition typrr-backend \
            --network-configuration "awsvpcConfiguration={subnets=[subnet-0e7de6c8fc870b9e4,subnet-066ec7f6416aa77cc],securityGroups=[sg-0254308430abf1e2e],assignPublicIp=ENABLED}" \
            --overrides '{"containerOverrides":[{"name":"backend","command":["sh","-c","npx prisma migrate deploy"]}]}'

      # =========================
      # DEPLOY ECS
      # =========================
      - name: Deploy ECS service
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --force-new-deployment

      # =========================
      # FRONTEND
      # =========================
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: typrr-frontend
        run: npm ci

      - name: Build frontend
        working-directory: typrr-frontend
        run: npm run build

      # =========================
      # S3
      # =========================
      - name: Upload to S3
        run: aws s3 sync typrr-frontend/dist s3://$S3_BUCKET --delete

      # =========================
      # CLOUDFRONT
      # =========================
      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_ID" \
            --paths "/*"