name: Deploy Typrr

on:
  push:
    branches: ["main"]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-central-1

  ECR_REGISTRY: 613136968754.dkr.ecr.eu-central-1.amazonaws.com
  ECR_REPOSITORY: typrr-backend

  ECS_CLUSTER: typrr-cluster
  ECS_SERVICE: typrr-backend-service

  S3_BUCKET: typrr-frontend-prod-613136968754
  CLOUDFRONT_ID: E4D0MBKIV3QMA

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # =========================
      # CHECKOUT
      # =========================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================
      # AWS AUTH
      # =========================
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::613136968754:role/github-actions-typrr
          aws-region: ${{ env.AWS_REGION }}

      # =========================
      # ECR LOGIN
      # =========================
      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region $AWS_REGION | \
          docker login --username AWS --password-stdin $ECR_REGISTRY

      # =========================
      # BUILD + PUSH (VERSIONED)
      # =========================
      - name: Set image tag
        run: echo "IMAGE_TAG=${GITHUB_SHA}" >> $GITHUB_ENV

      - name: Build Docker image
        run: docker build -t typrr-backend ./typrr-backend

      - name: Tag image
        run: |
          docker tag typrr-backend:latest \
          $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Push image
        run: docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      # =========================
      # MIGRATIONS (one-off task)
      # =========================
      - name: Run Prisma migrations
        run: |
          aws ecs run-task \
            --cluster "$ECS_CLUSTER" \
            --launch-type FARGATE \
            --task-definition typrr-backend \
            --network-configuration "awsvpcConfiguration={subnets=[subnet-04e6f4418cd7908e7,subnet-0790b88c6f7308e2c],securityGroups=[sg-0956a7a05f8e791c8],assignPublicIp=ENABLED}" \
            --overrides "{\"containerOverrides\":[{\"name\":\"backend\",\"command\":[\"sh\",\"-c\",\"npx prisma migrate deploy\"]}]}"

      # =========================
      # UPDATE TASK DEFINITION
      # =========================
      - name: Get current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition typrr-backend \
            --query taskDefinition > task-def.json

      - name: Update image in task definition
        run: |
          cat task-def.json | \
          jq --arg IMAGE "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
          '.containerDefinitions[0].image = $IMAGE |
           del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' \
          > new-task-def.json

      - name: Register new task definition
        run: |
          aws ecs register-task-definition \
            --cli-input-json file://new-task-def.json

      # =========================
      # DEPLOY ECS (NEW REVISION)
      # =========================
      - name: Deploy new version
        run: |
          NEW_REV=$(aws ecs describe-task-definition \
            --task-definition typrr-backend \
            --query "taskDefinition.revision" --output text)

          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_SERVICE \
            --task-definition typrr-backend:$NEW_REV

      # =========================
      # FRONTEND
      # =========================
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: typrr-frontend
        run: npm ci

      - name: Build frontend
        working-directory: typrr-frontend
        run: npm run build

      # =========================
      # S3 DEPLOY
      # =========================
      - name: Upload to S3
        run: aws s3 sync typrr-frontend/dist s3://$S3_BUCKET --delete

      # =========================
      # CLOUDFRONT INVALIDATION
      # =========================
      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_ID" \
            --paths "/*"